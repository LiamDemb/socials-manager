<header class="modal-head">
  <div class="frame-nav" data-frame-nav></div>
  <div class="head-row">
    <div class="head-text">
      {% if eyebrow %}<p class="eyebrow">{{ eyebrow }}</p>{% endif %}
      <h2 id="dialog-title" tabindex="-1">{{ heading }}</h2>
    </div>
    <button class="close" type="button" data-dialog-close aria-label="Close">×</button>
  </div>
</header>
